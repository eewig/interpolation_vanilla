<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>interpolation</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

  <script src="https://cdn.jsdelivr.net/npm/jspreadsheet-ce@5.0.4/dist/index.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jspreadsheet-ce@5.0.4/dist/jspreadsheet.min.css" type="text/css" />
  <script src="https://cdn.jsdelivr.net/npm/jsuites@5/dist/jsuites.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsuites@5/dist/jsuites.min.css" type="text/css" />

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js" integrity="sha256-SERKgtTty1vsDxll+qzd4Y2cF9swY9BCq62i9wXJ9Uo=" crossorigin="anonymous"></script>

  <script src='https://cdn.jsdelivr.net/npm/big.js@7.0.1/big.min.js'></script>

  <script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.21/dayjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.21/plugin/isSameOrAfter.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.21/plugin/isSameOrBefore.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.21/plugin/duration.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.21/plugin/utc.js"></script>

  

  <link rel="stylesheet" href="./style.css" type="text/css" />

</head>
<body>
  <main class="container-fluid px-3 pt-4">

    <div style="margin: 0 20px;">
      <div class="d-flex justify-content-end mb-2">
        <button id="fullscreen-btn" class="btn btn-outline-secondary btn-sm" onclick="toggleFullscreen()">Fullscreen</button>
      </div>

      <div id="chart-wrapper" class="mx-auto" style="max-width: 900px; min-height: 400px;">
        <canvas id="myChart"></canvas>
      </div>

    </div>

    <div class="d-flex justify-content-between mx-5 mt-5">
      <div>
        <h2>Input</h2>
        <div class="d-flex justify-content-start">
          
          <div id='sp-input'></div>
          <div class="mx-3">
            <div id="step-container">
              <h3 class="font-18">X Step</h3>
              <div class="input-group mb-3">
                <label for="x-data-type" class="input-group-text">data type</label>
                <select id="x-data-type" class="form-select">
                  <option value="n">number</option>
                  <option value="ms">millisecond</option>
                  <option value="s">second</option>
                  <option value="m">minute</option>
                  <option value="h">hour</option>
                  <option value="d">day</option>
                </select>
              </div>
              <div class="input-group">
                <label for="step-value" class="input-group-text">value</label>
                <input id="step-value" class="form-control" type="number" min="0" placeholder="Step">

              </div>

            </div>
            <div id="y-config">
              <h3 class="font-18 mt-3">Y</h3>
              <div class="input-group mb-3">
                <label for="y-min" class="input-group-text">
                  Y precision
                </label>
                <input id="y-min" class="form-control" type="number" placeholder="precision" value="2">
                <!-- <div class="form-text">(for numbers only)</div> -->
              </div>

            </div>
          </div>
          <div class="d-flex flex-column">
            <button class="btn btn-primary mb-3" onclick="calculate()">Calculate</button>
            <button class="btn btn-primary mb-3" onclick="plotInput()">Plot input</button>
            <button class="btn btn-primary" onclick="shiftInputDataToZero()">Shift to 0</button>
          </div>
        </div>
      </div>

      <div class="ms-3">
        <h2>Output</h2>
        <div class="d-flex">
          <div id="sp-output"></div>
          <div class="d-flex flex-column ms-3">
            <button class="btn btn-primary mb-3" onclick="plotOutput()">Plot output</button>
          </div>
        </div>

      </div>
    </div>


  </main>

<script src="./script.js"></script>
 
</body>
</html>
